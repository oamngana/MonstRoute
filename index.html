
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MonstRoute Ver.0.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101725;color:#f1f5ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:850px;margin:auto;padding:14px}
h1{font-size:23px;margin:10px 0}
p{line-height:1.6;color:#b9c9de}
.panel{background:#1e2b40;border:1px solid #354861;border-radius:13px;padding:13px;margin:12px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:7px}
button,.fileBtn{padding:10px 12px;background:#31435e;border:1px solid #59708d;border-radius:9px;color:white;font-size:14px;cursor:pointer}
button.active{background:#116e9e;border-color:#69d4ff}
button.primary{background:#08796d;border-color:#40dfc2;font-weight:bold}
.fileBtn{display:inline-block}
input[type=file]{display:none}
input[type=range]{width:100%}
.stage{border:1px solid #485b75;border-radius:10px;overflow:hidden;background:#090d16;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.result{width:100%;display:block;text-align:left;margin-top:8px;line-height:1.6}
.result.selected{background:#18556a;border-color:#72d9ee}
#status{white-space:pre-line;font-size:14px;line-height:1.7}
small{color:#afbed3}
.note{font-size:13px;color:#ffd49c}
@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:9px}}
</style>
</head>
<body>
<main>
<h1>🎯 MonstRoute <small>Ver.0.6</small></h1>
<p>ボスを経由して、できるだけ多くの壁に触れてからゴールに向かう角度を探します。</p>

<section class="panel">
<label class="fileBtn">
📷 スクショを読み込む
<input id="file" type="file" accept="image/*">
</label>
<button id="demo">画像なしで試す</button>
</section>

<section class="panel">
<div class="toolbar">
<button data-mode="board" class="active">① 盤面</button>
<button data-mode="start">② スタート</button>
<button data-mode="boss">③ ボス</button>
<button data-mode="goal">④ ゴール</button>
<button data-mode="move">✋ 移動・調整</button>
<button id="reset">配置リセット</button>
</div>
<p id="hint" style="font-size:13px">盤面の左上から右下へドラッグ</p>
</section>

<div class="stage">
<canvas id="canvas" width="720" height="1150"></canvas>
</div>

<section class="panel">
<div class="grid">
<div>
<label>最大反射回数：<b id="bounceLabel">12</b></label>
<input id="bounce" type="range" min="1" max="24" value="12">
</div>
<div>
<label>判定の余裕：<b id="marginLabel">10</b> px</label>
<input id="margin" type="range" min="0" max="50" value="10">
</div>
</div>
<p style="font-size:13px">ボスとゴールは円形。中心からドラッグして大きさを指定できます。移動・調整モードでは円の中心付近で移動、円周付近でサイズ変更できます。</p>
<div class="toolbar">
<button id="search" class="primary">🔍 ルートを自動探索</button>
<button id="clear">ルートを消す</button>
</div>
</section>

<section class="panel">
<b>探索結果</b>
<div id="status">スクショを読み込んで設定してください。</div>
<div id="results"></div>
</section>

<p class="note">※ 理想的な壁反射の試作版です。キャラの半径、敵との衝突、減速、地形ギミックなどは未対応です。画面上の角度は右向きが0°、下向きが90°です。</p>
</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

let image = null;
let mode = "board";
let drag = null;

let board = {x:35,y:205,w:650,h:805};
let start = {x:215,y:665};
let boss = {x:530,y:365,r:100};
let goal = {x:530,y:365,r:65};

let candidates = [];
let selected = -1;

const W = () => canvas.width;
const H = () => canvas.height;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);

function setMode(m){
 mode=m;
 document.querySelectorAll("[data-mode]").forEach(b=>{
  b.classList.toggle("active",b.dataset.mode===m);
 });
 const hints={
  board:"盤面の左上から右下へドラッグ",
  start:"スタートするキャラの中心をタップ",
  boss:"ボスの中心から外側へドラッグして円を設定",
  goal:"ゴールの中心から外側へドラッグして円を設定",
  move:"点や円をドラッグして位置・半径を調整"
 };
 $("hint").textContent=hints[m];
}

document.querySelectorAll("[data-mode]").forEach(b=>{
 b.onclick=()=>setMode(b.dataset.mode);
});

function pointerPos(e){
 const r=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*W()/r.width,
  y:(e.clientY-r.top)*H()/r.height
 };
}

function findHandle(p){
 const objects=[
  {name:"goal",obj:goal},
  {name:"boss",obj:boss}
 ];
 for(const item of objects){
  if(Math.abs(dist(p,item.obj)-item.obj.r)<24){
   return {kind:"radius",name:item.name};
  }
 }
 if(dist(p,start)<30)return {kind:"start"};
 for(const item of objects){
  if(dist(p,item.obj)<Math.min(35,item.obj.r)){
   return {kind:"center",name:item.name};
  }
 }
 return null;
}

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 canvas.setPointerCapture(e.pointerId);
 const p=pointerPos(e);

 if(mode==="board"){
  drag={kind:"board",origin:p};
  board={x:p.x,y:p.y,w:1,h:1};
 }else if(mode==="start"){
  start=p;
  drag={kind:"start"};
 }else if(mode==="boss"){
  boss={...p,r:12};
  drag={kind:"radius",name:"boss"};
 }else if(mode==="goal"){
  goal={...p,r:12};
  drag={kind:"radius",name:"goal"};
 }else{
  drag=findHandle(p);
  if(drag && drag.kind==="center"){
   const obj=drag.name==="boss"?boss:goal;
   drag.offset={x:p.x-obj.x,y:p.y-obj.y};
  }
 }

 candidates=[];
 selected=-1;
 $("results").innerHTML="";
 draw();
});

canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 e.preventDefault();
 const p=pointerPos(e);

 if(drag.kind==="board"){
  const a=drag.origin;
  board={
   x:Math.min(a.x,p.x),
   y:Math.min(a.y,p.y),
   w:Math.abs(p.x-a.x),
   h:Math.abs(p.y-a.y)
  };
 }else if(drag.kind==="start"){
  start=p;
 }else if(drag.kind==="center"){
  const obj=drag.name==="boss"?boss:goal;
  obj.x=p.x-drag.offset.x;
  obj.y=p.y-drag.offset.y;
 }else if(drag.kind==="radius"){
  const obj=drag.name==="boss"?boss:goal;
  obj.r=clamp(dist(p,obj),10,Math.min(W(),H())*.45);
 }
 draw();
});

canvas.addEventListener("pointerup",()=>{drag=null;draw()});
canvas.addEventListener("pointercancel",()=>{drag=null});

function drawCircle(obj,color,label){
 ctx.save();
 ctx.beginPath();
 ctx.arc(obj.x,obj.y,obj.r,0,Math.PI*2);
 ctx.fillStyle=color==="boss"?"rgba(255,75,105,.13)":"rgba(255,215,60,.13)";
 ctx.fill();
 ctx.lineWidth=3;
 ctx.strokeStyle=color==="boss"?"#ff5e80":"#ffe063";
 ctx.stroke();
 ctx.fillStyle=color==="boss"?"#ffb4c4":"#fff2a4";
 ctx.font="bold 19px sans-serif";
 ctx.textAlign="center";
 ctx.fillText(label,obj.x,obj.y);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W(),H());
 if(image){
  ctx.drawImage(image,0,0,W(),H());
 }else{
  ctx.fillStyle="#111b2a";
  ctx.fillRect(0,0,W(),H());
 }

 ctx.save();
 ctx.strokeStyle="#55e5ff";
 ctx.lineWidth=3;
 ctx.setLineDash([10,7]);
 ctx.strokeRect(board.x,board.y,board.w,board.h);
 ctx.restore();

 drawCircle(boss,"boss","BOSS");
 drawCircle(goal,"goal","GOAL");

 ctx.beginPath();
 ctx.arc(start.x,start.y,10,0,Math.PI*2);
 ctx.fillStyle="#42f5a1";
 ctx.fill();
 ctx.strokeStyle="#063c2d";
 ctx.lineWidth=3;
 ctx.stroke();
 ctx.fillStyle="#aaffd7";
 ctx.font="bold 17px sans-serif";
 ctx.textAlign="left";
 ctx.fillText("START",start.x+13,start.y-10);

 if(selected>=0 && candidates[selected]){
  const c=candidates[selected];
  ctx.save();
  ctx.lineWidth=5;
  ctx.lineJoin="round";
  ctx.strokeStyle=c.success?"#50ff99":"#ffcc54";
  ctx.shadowColor="#000";
  ctx.shadowBlur=5;
  ctx.beginPath();
  c.path.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  });
  ctx.stroke();
  ctx.shadowBlur=0;

  c.wallHits.forEach((h,i)=>{
   ctx.beginPath();
   ctx.arc(h.x,h.y,12,0,Math.PI*2);
   ctx.fillStyle="#103f62";
   ctx.fill();
   ctx.fillStyle="#fff";
   ctx.font="bold 15px sans-serif";
   ctx.textAlign="center";
   ctx.fillText(String(i+1),h.x,h.y+5);
  });

  if(c.bossPoint){
   ctx.beginPath();
   ctx.arc(c.bossPoint.x,c.bossPoint.y,8,0,Math.PI*2);
   ctx.fillStyle="#ff638a";
   ctx.fill();
  }
  if(c.goalPoint){
   ctx.beginPath();
   ctx.arc(c.goalPoint.x,c.goalPoint.y,8,0,Math.PI*2);
   ctx.fillStyle="#ffe35c";
   ctx.fill();
  }
  ctx.restore();
 }
}

function circleEntry(a,b,c,r){
 const dx=b.x-a.x,dy=b.y-a.y;
 const A=dx*dx+dy*dy;
 if(A<1e-12)return null;
 const fx=a.x-c.x,fy=a.y-c.y;
 const B=2*(fx*dx+fy*dy);
 const C=fx*fx+fy*fy-r*r;
 const disc=B*B-4*A*C;
 if(disc<0)return null;
 const root=Math.sqrt(disc);
 const t1=(-B-root)/(2*A);
 const t2=(-B+root)/(2*A);
 let t=null;
 if(t1>=0&&t1<=1)t=t1;
 else if(t2>=0&&t2<=1)t=t2;
 else if(C<=0)t=0;
 if(t===null)return null;
 return {x:a.x+dx*t,y:a.y+dy*t,t};
}

function segmentDistance(a,b,c){
 const dx=b.x-a.x,dy=b.y-a.y;
 const l2=dx*dx+dy*dy;
 const t=l2===0?0:clamp(
  ((c.x-a.x)*dx+(c.y-a.y)*dy)/l2,0,1
 );
 return {
  d:Math.hypot(a.x+dx*t-c.x,a.y+dy*t-c.y),
  point:{x:a.x+dx*t,y:a.y+dy*t},
  t
 };
}

function simulate(deg,maxBounces,margin){
 const rad=deg*Math.PI/180;
 let vx=Math.cos(rad),vy=Math.sin(rad);
 let p={...start};
 const x0=board.x,y0=board.y;
 const x1=x0+board.w,y1=y0+board.h;
 const path=[{...p}];
 const wallHits=[];
 const afterBossWalls=new Set();

 let touchedBoss=false;
 let bossPoint=null;
 let goalPoint=null;
 let success=false;
 let bestMiss=Infinity;
 let bestPoint=null;
 let bestPath=null;
 let bestWalls=0;
 let bestHits=0;

 for(let i=0;i<=maxBounces;i++){
  const tx=vx>1e-10?(x1-p.x)/vx:
           vx< -1e-10?(x0-p.x)/vx:Infinity;
  const ty=vy>1e-10?(y1-p.y)/vy:
           vy< -1e-10?(y0-p.y)/vy:Infinity;
  const t=Math.min(tx,ty);
  if(!Number.isFinite(t)||t< -1e-7)break;

  const q={x:p.x+vx*t,y:p.y+vy*t};

  const bHit=!touchedBoss?circleEntry(p,q,boss,boss.r):null;

  if(bHit){
   touchedBoss=true;
   bossPoint={x:bHit.x,y:bHit.y};
  }

  // ボスに触れる前の区間はゴール判定しない。
  const from=bHit?bHit:(touchedBoss?p:null);

  if(from){
   const gHit=circleEntry(from,q,goal,goal.r);
   if(gHit){
    goalPoint={x:gHit.x,y:gHit.y};
    path.push(goalPoint);
    success=true;
    break;
   }

   const nearest=segmentDistance(from,q,goal);
   const miss=Math.max(0,nearest.d-goal.r);
   if(
    miss<bestMiss ||
    (Math.abs(miss-bestMiss)<1e-8 &&
      afterBossWalls.size>bestWalls)
   ){
    bestMiss=miss;
    bestPoint=nearest.point;
    bestPath=[...path,q];
    bestWalls=afterBossWalls.size;
    bestHits=wallHits.filter(h=>h.afterBoss).length;
   }
  }

  path.push(q);
  if(i===maxBounces)break;

  const sides=[];
  if(Math.abs(tx-t)<1e-6){
   sides.push(vx>0?"右":"左");
   vx=-vx;
  }
  if(Math.abs(ty-t)<1e-6){
   sides.push(vy>0?"下":"上");
   vy=-vy;
  }

  if(sides.length===0)break;

  const afterBoss=touchedBoss;
  if(afterBoss)sides.forEach(s=>afterBossWalls.add(s));

  wallHits.push({...q,sides,afterBoss});
  p=q;
 }

 if(!touchedBoss)return null;

 return {
  deg,
  success,
  path:success?path:(bestPath||path),
  wallHits,
  bossPoint,
  goalPoint:success?goalPoint:bestPoint,
  unique:success?afterBossWalls.size:bestWalls,
  total:success
   ?wallHits.filter(h=>h.afterBoss).reduce((n,h)=>n+h.sides.length,0)
   :bestHits,
  miss:success?0:bestMiss,
  near:!success&&bestMiss<=margin
 };
}

function runSearch(){
 if(board.w<40||board.h<40){
  $("status").textContent="盤面を設定してください。";
  return;
 }
 if(
  start.x<=board.x||start.x>=board.x+board.w||
  start.y<=board.y||start.y>=board.y+board.h
 ){
  $("status").textContent="スタートが盤面の外です。";
  return;
 }

 const max=+$("bounce").value;
 const margin=+$("margin").value;
 const all=[];

 // 0.1度ずつ全方向を探索
 for(let i=0;i<3600;i++){
  const c=simulate(i/10,max,margin);
  if(c)all.push(c);
 }

 all.sort((a,b)=>{
  if(a.success!==b.success)return a.success?-1:1;
  if(a.success){
   return b.unique-a.unique||
          b.total-a.total||
          a.wallHits.length-b.wallHits.length;
  }
  return a.miss-b.miss||
         b.unique-a.unique||
         b.total-a.total;
 });

 const picked=[];
 for(const c of all){
  if(picked.some(p=>{
   const diff=Math.abs(((p.deg-c.deg+540)%360)-180);
   return diff<2;
  }))continue;
  picked.push(c);
  if(picked.length>=5)break;
 }

 candidates=picked;
 selected=candidates.length?0:-1;

 const successCount=all.filter(c=>c.success).length;
 const best=all.find(c=>c.success);

 $("status").textContent=
  `ボスを経由する角度：${all.length}件
ゴールまで到達する角度：${successCount}件
${best
 ? "最良候補：異なる壁 "+best.unique+"面、合計接触 "+best.total+"回"
 : "完全到達なし。黄色でゴールに近い候補を表示します。"}
※ 壁の接触数はボスに触れた後から数えます。`;

 const results=$("results");
 results.innerHTML="";

 candidates.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="result"+(i===selected?" selected":"");
  b.textContent=
   `候補${i+1}｜角度 ${c.deg.toFixed(1)}°｜`+
   `壁 ${c.unique}面・合計${c.total}回｜`+
   (c.success?"✅ ゴール到達":
    "ゴールまで約"+Math.round(c.miss)+"px");
  b.onclick=()=>{
   selected=i;
   document.querySelectorAll(".result").forEach((el,j)=>{
    el.classList.toggle("selected",i===j);
   });
   draw();
  };
  results.appendChild(b);
 });
 draw();
}

$("search").onclick=runSearch;

$("clear").onclick=()=>{
 candidates=[];
 selected=-1;
 $("results").innerHTML="";
 $("status").textContent="ルートを消しました。";
 draw();
};

function resetPositions(){
 board={x:35,y:H()*.15,w:W()-70,h:H()*.65};
 start={x:W()*.30,y:H()*.55};
 boss={x:W()*.72,y:H()*.32,r:W()*.16};
 goal={x:W()*.73,y:H()*.32,r:W()*.09};
 candidates=[];
 selected=-1;
 $("results").innerHTML="";
 draw();
}

$("reset").onclick=()=>{
 resetPositions();
 $("status").textContent="配置をリセットしました。";
};

$("bounce").oninput=e=>{
 $("bounceLabel").textContent=e.target.value;
};

$("margin").oninput=e=>{
 $("marginLabel").textContent=e.target.value;
};

$("file").onchange=e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 const url=URL.createObjectURL(file);
 const im=new Image();

 im.onload=()=>{
  image=im;
  canvas.width=720;
  canvas.height=Math.round(
   720*im.naturalHeight/im.naturalWidth
  );
  resetPositions();
  setMode("board");
  $("status").textContent=
   "①盤面 → ②スタート → ③ボス → ④ゴール → 探索";
  URL.revokeObjectURL(url);
 };
 im.onerror=()=>{
  $("status").textContent="画像の読み込みに失敗しました。";
  URL.revokeObjectURL(url);
 };
 im.src=url;
};

$("demo").onclick=()=>{
 image=null;
 canvas.width=720;
 canvas.height=1150;
 resetPositions();
 setMode("move");
 $("status").textContent=
  "デモ配置です。ルートを自動探索してみてください。";
};

draw();
})();
</script>
</body>
</html>
